<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="나에게 맞는 프로그래밍 언어를 찾아보아요">
  <title>2026 | 프로그래밍 언어 추천</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="site-header">
      <a class="brand" href="./" aria-label="CodeCompass 홈">프로그래밍 언어추천</a>
      <span class="header-note">21024 이종원 인공지능 수학 수행평가</span>
    </header>

    <section id="intro" class="panel intro">
      <p class="eyebrow">잘 맞는 언어를 찾아보세여</p>
      <h1>프로그래밍 언어 추천<br>프로그</h1>
      <p class="intro-copy">질문에 답하면 관심 분야와 목표에 맞는 언어를 추천해 드려요.</p>
      <button id="start-btn" class="primary-btn">테스트 시작하기 <span aria-hidden="true">→</span></button>
      <p class="small-note">약 2~5분 소요</p>
    </section>

    <section id="quiz" class="panel quiz hidden" aria-live="polite">
      <div class="progress-row">
        <span id="question-count">질문 1 / 9</span>
        <span id="progress-percent">11%</span>
      </div>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      <p id="question-category" class="eyebrow"></p>
      <h2 id="question-title"></h2>
      <p id="question-description" class="question-description"></p>
      <div id="options" class="options"></div>
      <div class="quiz-footer">
        <button id="back-btn" class="text-btn" type="button">← 이전</button>
        <span id="answer-hint" class="answer-hint">답변을 선택해 주세요.</span>
        <button id="next-btn" class="primary-btn" type="button" disabled>다음 →</button>
      </div>
    </section>

    <section id="result" class="panel result hidden" aria-live="polite">
      <p class="eyebrow">결과</p>
      <h1>당신에게 어울리는 언어</h1>
      <p class="intro-copy">답변을 바탕으로 잘 맞는 언어를 골랐어요.</p>
      <div id="result-list" class="result-list"></div>
      <div class="result-actions">
        <button id="restart-btn" class="primary-btn">다시 테스트하기</button>
        <button id="copy-btn" class="secondary-btn">결과 복사하기</button>
      </div>
      <p class="disclaimer">이 결과는 참고용 추천이에요. 나중가면 학습 경험에 따라 달라질 수 있어요.</p>
    </section>

    <footer class="site-footer">프로그래밍 언어추천 프로그램</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
